ekf_filter_node:
  ros__parameters:
    # Keep transform publication reliable on the Raspberry Pi under SLAM load.
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Fuse forward speed and yaw rate from commanded wheel-step odometry.
    odom0: /wheel/odom
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]
    odom0_queue_size: 10

    # MPU6050 has no absolute yaw source; fuse measured yaw rate only.
    imu0: /imu/data
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
