base_controller:
  ros__parameters:
    # Order: left-front, left-rear, right-front, right-rear (BCM numbering).
    step_pins: [14, 23, 17, 5]
    dir_pins: [15, 24, 27, 6]
    reset_pins: [4, 25, 22, 26]
    sleep_pins: [12, 7, 16, 1]
    direction_inverted: [true, true, false, false]

    # Directly calibrated physical movement conversions.
    left_steps_per_meter: 652.0
    right_steps_per_meter: 645.0
    turn_steps_per_radian: 54.75

    # Pulse frequency controls speed; these conservative full-step limits
    # preserve approximately the previous 0.115 m/s and 0.154 m/s^2 limits.
    max_step_rate: 75.0
    max_step_acceleration: 100.0
    command_timeout: 0.5
    debug_logging: false
